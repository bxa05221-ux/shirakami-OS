title: 和算Protocol
subtitle:
  - Wasan Protocol
version: 0.1
status: candidate

purpose: >
  和算を題材とした問題・計算・検証を、Shirakami Runtime上で
  Protocolとして扱うための最小候補定義。
  和算そのものの歴史的・数学的意味を再定義しない。

input:
  problem: ""
  known: []
  unknown: []
  constraints: []

execution:
  mode: problem_solving
  calculation_backend: replaceable
  preserve_intermediate_steps: true

output:
  interpretation: ""
  steps: []
  result: ""
  verification: ""

observation:
  record:
    problem: ""
    assumptions: []
    steps: []
    result: ""
    verification: ""

constraints:
  - no_theory_extension
  - no_result_without_traceable_steps
  - backend_replaceable
  - human_final_judgment
  - evidence_preservation

promotion:
  current_state: candidate
  next_gate:
    - schema_validation
    - runtime_test
    - execution_evidence

boundary:
  protocol_defines_problem_structure: true
  runtime_owns_domain_truth: false
  mathematical_result_requires_verification: true
