      note: historical identifier retained for compatibility; VR企画は頓挫

  promotion_rule:
    candidate: >
      Protocol boundary → schema → validation → runtime test → evidence
    protocolized: >
      Registry entry → loader/runtime integration → verification evidence
    foundational_protocol: >
      Preserve as protocol artifact; do not promote to Runtime semantics without accepted specification/research handoff
    archived: >
      Historical record only; not a Runtime execution target

  boundary:
    registry_is_index: true
    registry_is_runtime_contract: false
    theory_must_not_be_extended_here: true
    one_change_one_verification: true
