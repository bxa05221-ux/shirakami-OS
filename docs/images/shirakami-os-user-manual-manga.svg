<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1500" viewBox="0 0 1000 1500"><rect width="1000" height="1500" fill="#fff"/><g font-family="sans-serif" fill="#111"><text x="500" y="70" text-anchor="middle" font-size="42" font-weight="700">白神OS ユーザーズマニュアル</text><text x="500" y="108" text-anchor="middle" font-size="22">Public Alpha / Runtime β0.1 ― 漫画でわかる最小構成</text><rect x="35" y="140" width="930" height="260" rx="12" fill="#eef7ff" stroke="#222" stroke-width="4"/><text x="65" y="185" font-size="30" font-weight="700">① 白神OSってなに？</text><circle cx="145" cy="285" r="55" fill="#f4c7a1" stroke="#222" stroke-width="4"/><path d="M100 270 Q145 220 190 270" fill="#5b3b2d" stroke="#222" stroke-width="5"/><path d="M205 235 Q330 205 470 250 Q360 330 205 305Z" fill="#fff" stroke="#222" stroke-width="4"/><text x="330" y="270" text-anchor="middle" font-size="23">AIそのものを作るOSじゃないよ。</text><text x="330" y="303" text-anchor="middle" font-size="23">人間のLandscapeを中心にするの。</text><rect x="560" y="215" width="360" height="125" rx="12" fill="#fff" stroke="#557" stroke-width="3"/><text x="740" y="250" text-anchor="middle" font-size="22" font-weight="700">Landscape</text><text x="740" y="282" text-anchor="middle" font-size="19">文脈・記録・状態のまとまり</text><text x="740" y="312" text-anchor="middle" font-size="19">AIが変わっても残したいもの</text><rect x="35" y="420" width="930" height="300" rx="12" fill="#fffaf0" stroke="#222" stroke-width="4"/><text x="65" y="465" font-size="30" font-weight="700">② 的目YAMLからRuntimeへ</text><g font-size="20" text-anchor="middle"><rect x="75" y="520" width="170" height="110" rx="10" fill="#e9f1ff" stroke="#222" stroke-width="3"/><text x="160" y="565">的目 YAML</text><text x="160" y="595">Protocolの定義</text><rect x="315" y="520" width="170" height="110" rx="10" fill="#edf9ed" stroke="#222" stroke-width="3"/><text x="400" y="565">Protocol</text><text x="400" y="595">Loader / IR</text><rect x="555" y="520" width="170" height="110" rx="10" fill="#fff0d8" stroke="#222" stroke-width="3"/><text x="640" y="565">Runtime</text><text x="640" y="595">実行する</text><rect x="795" y="520" width="120" height="110" rx="10" fill="#e8f8f8" stroke="#222" stroke-width="3"/><text x="855" y="565">Evidence</text><text x="855" y="595">記録</text></g><g stroke="#222" stroke-width="5" fill="none"><path d="M245 575h65"/><path d="M485 575h65"/><path d="M725 575h65"/></g><text x="500" y="675" text-anchor="middle" font-size="18">定義 → 読み込み → 実行 → 証拠として保存</text><rect x="35" y="740" width="450" height="310" rx="12" fill="#f4fff5" stroke="#222" stroke-width="4"/><text x="65" y="785" font-size="28" font-weight="700">③ まず動かす</text><text x="70" y="830" font-size="20">1. Repositoryをclone</text><text x="70" y="865" font-size="20">2. Python環境を準備</text><text x="70" y="900" font-size="20">3. requirementsを導入</text><text x="70" y="935" font-size="20">4. sample YAMLを確認</text><text x="70" y="970" font-size="20">5. Runtimeを実行</text><rect x="70" y="995" width="350" height="40" rx="7" fill="#111"/><text x="245" y="1022" text-anchor="middle" font-size="17" fill="#fff">python -m runtime.main</text><rect x="515" y="740" width="450" height="310" rx="12" fill="#fff5f5" stroke="#222" stroke-width="4"/><text x="545" y="785" font-size="28" font-weight="700">④ 何が起きる？</text><text x="550" y="830" font-size="20">Protocol IRを生成</text><text x="550" y="865" font-size="20">↓</text><text x="550" y="900" font-size="20">RuntimeがTransitionを実行</text><text x="550" y="935" font-size="20">↓</text><text x="550" y="970" font-size="20">Evidenceを記録</text><text x="550" y="1005" font-size="20">↓</text><text x="550" y="1038" font-size="20">Landscape Stateへ反映</text><rect x="35" y="1070" width="930" height="240" rx="12" fill="#f6f2ff" stroke="#222" stroke-width="4"/><text x="65" y="1115" font-size="30" font-weight="700">⑤ 開発者から見ると</text><text x="70" y="1160" font-size="20">READMEを見る</text><text x="70" y="1195" font-size="20">→ Quickstartを動かす</text><text x="70" y="1230" font-size="20">→ Protocol / Runtime / Evidenceを読む</text><text x="70" y="1265" font-size="20">→ Issueで「ここはどうなってる？」を質問する</text><path d="M600 1145 Q760 1085 900 1170" fill="none" stroke="#222" stroke-width="4"/><path d="M890 1160l20 10-15 15" fill="none" stroke="#222" stroke-width="4"/><text x="750" y="1215" text-anchor="middle" font-size="22" font-weight="700">「まだ完成品じゃない」</text><text x="750" y="1250" text-anchor="middle" font-size="20">だからこそ、外から観測する。</text><rect x="35" y="1330" width="930" height="125" rx="12" fill="#fff" stroke="#222" stroke-width="4"/><text x="65" y="1370" font-size="26" font-weight="700">⑥ 次の流れ</text><text x="65" y="1410" font-size="20">公開 → Observation → Evidence → レビュー → 次の設計</text><text x="65" y="1440" font-size="20">GitHub: bxa05221-ux/shirakami-OS</text></g></svg>