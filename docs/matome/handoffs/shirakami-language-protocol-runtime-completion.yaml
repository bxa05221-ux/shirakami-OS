matome:
  id: shirakami-language-protocol-runtime-completion
  title: "Shirakami Runtime — 言語プロトコル起動基盤 完成引継ぎ"
  version: "0.1"
  status: "implementation_handoff"
  purpose:
    - "言語プロトコルを直接起動対象として扱えるRuntime基盤の完成状態を引き継ぐ"
    - "仮説・手順・対話構造を、個別APIへ変換せず言語プロトコルとして起動可能にする"
    - "Runtimeがプロトコル固有の意味論を所有しない境界を維持する"
    - "実モデル観測をオペレータ環境へ引き渡す"
  completed:
    language_protocols:
      - {id: "shirakami-3d-pruim", name: "3D-PRUIM", status: "adopted"}
      - {id: "shirakami-anmon-layer-reverse", name: "暗問層逆算プロトコル", status: "adopted"}
      - {id: "shirakami-cognitive-echolocalization-hypothesis-v0.1", name: "認知エコーロケーション基本仮説", status: "research_hypothesis_activation"}
      - {id: "shirakami-thread-rpg-v3.2", name: "Thread RPG 3.2", status: "adopted"}
  runtime_path:
    - "User Utterance"
    - "Landscape"
    - "OPPAI"
    - "Language Protocol"
    - "Matome"
    - "Protocol IR"
    - "Protocol Registry"
    - "Shirakami Runtime"
    - "Adapter"
    - "External AI"
    - "Response"
    - "Evidence"
    - "User Re-projection"
  protocol_activation:
    principle: >
      言語プロトコルを個別APIへ変換するのではなく、
      既存のProtocol Loader / Registry / Runtime / Adapter境界から
      そのまま起動対象として扱う。
    verified:
      - "Matome YAMLのロード"
      - "Protocol IDの解決"
      - "Registryへの登録"
      - "Protocol Request生成"
      - "Protocol invocation"
      - "同一Landscapeを複数Protocolへ投入する比較境界"
      - "明示的Protocol IDによる日本語タイトルのID衝突回避"
  hypothesis_activation:
    statement: "仮説そのものを、起動可能な言語プロトコルとして置くことができる。"
    boundary:
      hypothesis_is_not:
        - "AIによる真偽判定"
        - "Runtime Domain Semantic Truth"
        - "自動的な研究成果"
        - "専用API"
        - "AI人格定義"
      hypothesis_can_be:
        - "人間が検討する言語的構造"
        - "観測を行うためのProtocol"
        - "AIとの相互作用へ投入可能な起動単位"
        - "再観測・再仮説化の対象"
  thread_rpg_3_2:
    role: "language_protocol"
    principle:
      - "単一Landscapeを複数の短い発言・視点から観測する"
      - "固定人格を設定しない"
      - "短い相互作用として出力する"
      - "不一致・誤解・訂正・共感・茶化し・沈黙を許容する"
      - "未解決を未解決のまま保持できる"
      - "AIの個性をProtocol側で定義しない"
  cognitive_echolocalization:
    role: "research_hypothesis_activation"
    implementation_status: "not_a_runtime_cognitive_mechanism"
    principle: ["発話","エコー","差異の観察","再発話","未解決の継続"]
    critical_boundary:
      - "エコーは真実ではない"
      - "AI応答は経験そのものではない"
      - "認知状態をAIが断定しない"
      - "経験・人格をRuntimeへ実装しない"
  adapter_boundary:
    runtime_provides: ["正規化された入力","Protocol識別","実行境界","Evidence記録"]
    adapter_provides: ["外部AIへの接続","モデルから返されたopaque output"]
    runtime_does_not:
      - "モデル固有の意味論を埋め込む"
      - "Protocol本文を勝手に再解釈する"
      - "AI人格を生成する"
      - "研究仮説を真実として扱う"
  real_model_experiment:
    status: "operator_ready"
    included:
      - "四つの言語プロトコルを同一Landscapeへ投入する実行ハーネス"
      - "各実行結果の個別保存"
      - "raw input"
      - "protocol id"
      - "version"
      - "canonical input"
      - "model output"
      - "OPPAI observation"
      - "Evidence"
    provider:
      name: "Anthropic"
      credential:
        source: "operator_environment"
        repository_storage: false
    execution_status:
      actual_external_model_execution: "not_yet_executed"
      reason: "API credential is not available in the current execution environment"
  verification:
    language_protocol_smoke: "passed"
    runtime_verification: "passed"
    operational_verification: "passed"
    mainline_integration: "merged"
    language_protocol_pr:
      number: 200
      status: "merged"
      merge_sha: "ad48ff8112a2e2c4bf3941d4ec02b5c8825c393e"
    real_model_harness_pr:
      number: 201
      status: "merged"
      merge_sha: "d75cccdc766d592c881513cabf2d1b2d4b3960c0"
  evidence_boundary:
    proven:
      - "言語プロトコルを既存Runtime経路へ直接搭載できる"
      - "複数の異なるProtocolを同一Runtime境界から起動できる"
      - "Protocol固有意味論をRuntime Coreへ埋め込まずに扱える"
      - "仮説を言語プロトコルとして起動対象にできる"
