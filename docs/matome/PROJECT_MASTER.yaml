matome:
  id: "shirakami-project-master-landscape"
  title: "白神プロジェクト全体Landscape"
  subtitle: ["Shirakami Project Master Landscape","Project-Level Semantic Handoff"]
  version: "1.0"
  status: "active"
  role: "project_master_landscape"
  project:
    name: "Shirakami Project"
    historical_names: ["白神モデル","Shirakami OS"]
    current_understanding: >
      人間のLandscape・Context・Protocol・Evidenceを中心に置き、
      AIやRuntimeを交換可能な実行環境として扱うProtocol-driven Runtime / AI habitat project。
    goal: >
      AIそのものを資産化するのではなく、人間のLandscapeとContextの連続性を
      AI世代・Runtime世代を越えて維持する。
  principles:
    - "Landscape First"
    - "Protocol First"
    - "Human Context First"
    - "User Context Ownership"
    - "Model Independence"
    - "Backend Independence"
    - "Runtime Replaceability"
    - "Observable Evidence"
    - "Verification Before Transition"
    - "Minimum Centralization"
  architecture:
    canonical_flow: ["Human","Landscape","Evidence","Protocol","Runtime","Adapter","External AI / Tool","Renderer","Human"]
    implementation_flow: ["Landscape","Evidence","Protocol","Protocol IR","Runtime","Adapter","Backend"]
    responsibilities:
      landscape: "人間のContext、Knowledge、Memory、Projects、Skills、Permissions等を保持する空間。"
      evidence: "実行・観測・検証の結果を記録するObservable Trail。"
      protocol: "意図・境界・観測・遷移・検証を宣言する規約。"
      protocol_ir: "的目YAMLをRuntimeが扱う構造へ変換する層。"
      runtime: "Protocolを検証・実行し、Transition/Resultを生成する薄い実行層。"
      adapter: "RuntimeとGitHub、AI、外部サービス等を接続する境界。"
      renderer: "Landscapeを漫画・Radio・Thread RPG・Document等へ投影する層。"
      external_ai: "交換可能な生成・推論・変換等の外部計算資源。"
  semantic_handoff:
    format: "的目YAML"
    role: "Research、Dialogue、Experiment、Design、Implementation、Verification間で意味を受け渡す正式なSemantic Handoff形式。"
    lifecycle: ["Observation","Discovery","Matome YAML","Design / Protocol","Implementation","Experiment","Verification","Evidence","Next Matome YAML"]
  document_responsibility:
    vision: "なぜ作るのか"
    constitution: "何を守るのか"
    blueprint: "何がどの責務を持つのか"
    design: "どう実現するのか"
    implementation: "何が実際に動いているのか"
    matome: "何を次へ引き渡すのか"
  protocol_ecology:
    established: ["暗問層","認知エコーロケーション","3D-PRUIM","象徴再帰","Thread RPG","漫画パイプライン","白神ラジオ","AASS","水脈","雨水モード","こだま","観察レビュー","Evidence Contract","Repository Event Contract","逐次検証型マルチエージェント","暗問層逆算プロトコル"]
    rule: "ここでは既存名称を棚卸しするのみとし、各Protocolの意味を再定義しない。"
  historical_lineage:
    early_project_structure: ["白神スレッドRPG","連山モデル","白神歌仙","人格モデル","河川モデル"]
    note: "歴史的系譜として保持し、現在のRuntime architectureと無条件に同一視しない。"
  implementation:
    current_position: "β1.0 Launch Model / Operational Rollout"
    priorities: ["Protocol Registry","Protocol Loader","Protocol Runtime","State Machine","Evidence / Trail","Permission","Adapter","Renderer","Test","API extraction"]
  verification:
    rules: ["確認できるまで成功にしない","Observable Evidence","Verification Before Transition"]
    artifact_mismatch: "Artifact mismatchは黙って修正せず、検出可能な不一致として保持する。"
    execution_identity: "Operation IDとExecution IDを分離し、実行単位を再現可能なEvidenceとして扱う。"
  boundaries:
    runtime: ["Domain Meaningを発明しない","宣言された条件を検証する","Permissionを検証する","Transitionを実行する","EvidenceをRecordする","EvidenceをPreserveする"]
    research_implementation: "Research上の理論をImplementation側で勝手に変更・拡張しない。実装上の理論的課題はResearchへフィードバックする。"
    naming: "「Shirakami OS」は歴史的名称として保持するが、実装上の中心はRuntimeとして扱う。"
  repository:
    canonical_repository: "bxa05221-ux/shirakami-OS"
    matome_root: "docs/matome/"
    structure: ["project-landscape.yaml","PROJECT_MASTER.yaml","INDEX.yaml","protocols/","architecture/","experiments/","handoffs/","archive/"]
  collection:
    project_master: "defined"
    individual_matome_collection: "in_progress"
    completeness_rule: "個別的目YAMLは原型を保持して別資産として収録し、重複・版違い・旧版は勝手に統合しない。"
