id: shirakami-os-r0061-beta1-operation-loop
title: "Shirakami OS β1.0 — R0061 Operation Loop Handoff"
version: "0.1"
status: implementation_handoff

phase:
  from: "β1.0 operation start"
  to: "β1.0 continuous operation"
  principle: "運用そのものを観測可能にする"

preceding_state:
  operation_start:
    id: "BETA1-OPERATION-START"
    merge_sha: "33da2869ef9b4a3722af47cc797a5f308d149c89"
    status: merged
  verified_baseline:
    - R0057
    - R0058
    - R0059
    - R0060
  canonical_verification: "test-runtime"

objective:
  statement: >
    β1.0 Operation Start後の最初の運用観測として、保護されたmainを起点に
    既存のLandscape / Evidence / Protocol / Runtime / Adapter / Renderer境界を
    維持したまま、運用ループを開始できることを記録する。

scope:
  change: "documentation-only operational observation"
  allowed:
    - "operation state observation"
    - "current baseline recording"
    - "canonical verification"
    - "addressable Evidence recording"
  forbidden:
    - "new theory"
    - "new Protocol semantics"
    - "Landscape schema redesign"
    - "Adapter contract change"
    - "Renderer contract change"
    - "AI/model quality evaluation"

operational_invariants:
  landscape:
    - "Landscape remains the continuity target"
  evidence:
    - "Evidence remains independently observable"
    - "Evidence is recorded and preserved"
    - "Evidence is not rewritten"
  adapter:
    - "Adapter remains exchangeable"
    - "Adapter has no semantic authority"
  renderer:
    - "Renderer remains a presentation boundary"
    - "Renderer has no semantic authority"
  runtime:
    - "Runtime does not invent domain meaning"
  uncertainty:
    - "Unknown history is not filled by guesswork"

verification:
  rule:
    - "One Change / One Verification"
    - "file existence != experiment success"
    - "unverified != success"
  gate: "test-runtime"
  merge_rule:
    - "protected main only"
    - "no direct unverified change"
    - "no force push"

expected_evidence:
  - "R0061 observation artifact"
  - "canonical test-runtime result"
  - "protected merge result"
  - "resulting commit SHA"

completion_condition:
  - "R0061 observation is addressable"
  - "test-runtime succeeds"
  - "protected main merge succeeds"
  - "result is recorded without reconstructing historical lineage"

next:
  name: "β1.0 Continuous Operational Loop"
  rule: >
    R0061完了後は、実運用上の変更を一件ずつ観測し、変更・検証・Evidenceを
    明示的に記録する。理論的課題はRuntime側で解決せず研究側へ返す。
