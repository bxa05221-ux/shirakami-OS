  execution: not independently executed in this verification pass
input:
  - successful ExecutionResult produced by Runtime.example_protocol
  - failed ExecutionResult produced by a protocol raising RuntimeError
expected:
  - EvidenceRecord is immutable at the dataclass level
  - transition_data cannot be mutated through the exposed mapping
  - successful transitions are identifiable as transition evidence
  - failure results remain observable but are not classified as transition evidence
observed:
