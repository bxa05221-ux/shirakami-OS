matome:
  title: "Evidence Identity / Observation Representation / Semantic Reference / Execution Boundary"
  codename: "Four Identity Boundaries"
  version: "0.2"
  status: "Research Finding"

  project:
    name: "白神モデルβ版研究"
    repository: "bxa05221-ux/shirakami-OS"

  finding:
    statement: >
      Evidence、Observation、Semantic Reference、Executionは、
      同一のidentity概念として扱ってはならない。特に現在の/observe境界では、
      observation_idは実行イベントIDではなく、観測された表現を識別する値として扱われる。
      APIは意味を伝達するが、ExecutionやAuthorityを生成しない。

  identities:
    evidence:
      field: "evidence_id"
      meaning: "Evidence内容そのものの安定したidentity"
      property:
        - "同一内容なら同一ID"
        - "内容が変化すれば異なるID"
      role: "Evidence identity"

    observation:
      field: "observation_id"
      meaning: "API境界で返される観測表現を識別するidentity"
      property:
        - "Landscapeと観測snapshotから決定される"
        - "同一の観測表現は同一IDになり得る"
        - "Execution identityとして解釈しない"
      role: "Observation representation identity"

    semantic_reference:
      field: "evidence_ids"
      meaning: >
        SemanticHandoff等が参照するEvidence identityの集合。Evidenceそのものを再生成せず、
        stable evidence_idによって参照する。現在の/observeレスポンスでの公開は未確定であり、
        既存のAPI契約と矛盾しない形で別途定義する。
      role: "Semantic reference"

    execution:
      field: "execution_id"
      meaning: >
        実行単位を識別する概念。ただし現在の/observe APIではExecution identityを生成、
        受理、推論、または返却しない。
      role: "Execution boundary, not /observe identity"

  canonical_relationship:
    - "Observation representation may reference Evidence"
    - "Evidence has stable content identity"
    - "SemanticHandoff may carry Evidence references when explicitly defined"
    - "Execution is a separate boundary and is not created by /observe"

  boundary_rules:
    - "evidence_idをobservation_idとして使用しない"
    - "observation_idをexecution_idとして使用しない"
    - "同一観測表現の再出現を異なるoccurrenceと仮定しない"
    - "SemanticHandoffでEvidenceを再生成しない"
    - "execution_idを/observeへ暗黙導入しない"
    - "API境界では既存のidentity意味を保持する"

  current_api_contract:
    source: "docs/research/api-semantic-handoff-boundary-v0.1.yaml"
    rules:
      - "authority_created: false"
      - "execution_created: false"
      - "observation_id is generated"
      - "evidence_id is currently nullable"
      - "protocol_id is an explicit reference only"
      - "execution_id is forbidden at /observe"

  implementation_rule:
    owner: "Research → Runtime"
    rule: >
      この意味境界をRuntime実装へ反映する際、実装都合によってidentityの意味を変更しない。
      既存API契約と矛盾する新しいidentityを追加する場合は、先にResearch Findingを更新する。

  verification:
    required:
      - "同一Evidence → 同一evidence_id"
      - "observation_idがExecution identityとして扱われない"
      - "同一観測表現の再現性が保持される"
      - "Semantic Referenceがstable evidence_idを参照する場合、その意味が保持される"
      - "/observeがexecution_idを生成・推論しない"
      - "API/HTTP境界でauthorityを生成しない"

  implementation_finding:
    current_state:
      - "Evidence stable identityはmainへ確定"
      - "現在の/observe APIはobservation_idを返す"
      - "現在の/observe APIはevidence_idをnullableとして返す"
      - "現在の/observe APIはexecution_idを拒否する"
      - "SemanticHandoffのevidence_ids公開境界は未確定"

  next_step:
    priority: "high"
    action: >
      既存API契約を壊さず、Semantic Referenceの必要性と公開境界を再評価する。
      実装が必要な場合のみ、意味を確定した上でRuntimeへ最小変更として反映する。

  critical_rule:
    - "会話を実装上の正本にしない"
    - "GitHub mainを実装正本とする"
    - "意味は的目YAMLで固定する"
    - "理論未確定のままRuntimeへ埋め込まない"
    - "APIは意味を渡すが権限を作らない"
    - "一変更一検証"
