reading_experiment:
  current_questions:
    - "日常と非日常の温度差は、作品全体に再現される構造なのか"
    - "象徴は意味を説明するためだけでなく、Scene間を接続する媒体として機能しているのか"
    - "宗教的Sceneと技術的Sceneの並行配置は、どの時点でRelationとして観測できるか"
    - "『斜め上』は物語上のギャグなのか、意思決定の反復パターンとして観測できるのか"
    - "作者の好みを先に入力しなくても、作品本文だけから上記パターンを検出できるか"
  rule: "問いは仮説であり、作品本文の事実として確定しない"

provenance_rule:
  - "source_evidenceを必ず保持する"
  - "本文にない時間・場所・人物心理を補完しない"
  - "不明な項目は推測せず未確定として扱う"
  - "別EditionのSceneは混在させない"
  - "ObservationとInterpretationを分離する"

next:
  - "第一部未抽出章の本文Evidenceを補完する"
  - "第二部未抽出章の本文Evidenceを補完する"
