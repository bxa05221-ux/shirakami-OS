source_observations:
  - "ChapterとSceneは一致しない。第二十一章では本文中にラボへの明示的な場所転換がある。"
  - "第二十三章以降も時間・場所・視点の切替を本文から確認する必要がある。"
  - "Scene Mapは現時点では部分確定であり、全章の網羅的確定を宣言しない。"
  - "Scene境界の確定と、Sceneの意味解釈は分離する。"

provenance_rule:
  - "source_evidenceを必ず保持する。"
  - "本文にない時間・場所・人物心理を補完しない。"
  - "不明な項目は推測せず未確定として扱う。"
  - "別EditionのSceneは混在させない。"

next_step:
  - "第一部全章の本文境界を確認する"
  - "第二部全章の本文境界を確認する"
  - "各Sceneにsource rangeを付与する"
  - "Scene間RelationはScene Map完成後に別Artifactとして扱う"
