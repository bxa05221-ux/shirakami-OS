matome:
  title: "機械仕掛けのマリアのプロトコル — Scene Map"
  subtitle:
    - "AIとともに読む小説"
    - "Source-grounded scene boundaries"
  version: "0.1"
  status:
    design: draft
    source: "機械仕掛けのマリアのプロトコル（規約）通し版.docx"
    completeness: partial

statement: >
  Chapter Mapより下位の読書単位として、本文に明示された時間・場所・視点・出来事の
  切替を観測し、Scene境界を記録する。文学的意味や人物心理を推定してSceneを生成しない。

scene_boundary_rules:
  primary:
    - "明示的な場所の切替"
    - "明示的な時間の切替"
    - "語り手・視点の明示的な切替"
    - "場面を区切る明示的な本文表現"
    - "章内で独立した出来事として本文上確認できるまとまり"
  forbidden:
    - "心理解釈だけを根拠にSceneを分割しない"
    - "テーマや象徴だけを根拠にSceneを分割しない"
    - "作者の意図を推定して境界を作らない"
    - "別Editionの本文を混在させない"

scene_schema:
  required:
    - "scene_id"
    - "chapter_order"
    - "boundary_basis"
    - "source_evidence"
  optional:
    - "time"
    - "place"
    - "viewpoint"
    - "actors"
    - "event"
    - "transition_note"

