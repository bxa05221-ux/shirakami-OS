relations:
  temporal:
    status: author_verification_required
  character:
    status: author_verification_required
  event:
    status: author_verification_required
  location:
    status: author_verification_required
  thematic:
    status: author_verification_required

revision_model:
  source_versions:
    - manuscript-v1
    - manuscript-v2
    - manuscript-vN
  transition:
    - source_observation
    - change_detection
    - impact_observation
    - author_confirmation
    - landscape_update
  rule: >
    A later manuscript version does not erase earlier evidence. The Runtime
    records the transition and preserves provenance.

observation_model:
  observation: >
    What can be directly grounded in the manuscript or an explicitly supplied
    author statement.
  evidence: >
    Immutable record of an observed transition or verified source relation.
  canonical: >
    A relation explicitly confirmed by the author or authoritative work source.
  hypothesis: >
    An AI-derived interpretation or possible relation not yet confirmed.
  unresolved: >
    A question or relation that must remain open until verified.

protocol_pipeline:
  - source_manifest
  - chapter_map
  - landscape_manifest
  - observation
  - evidence
  - protocol_extraction
  - revision_tracking
  - language_projection
  - media_transformation
  - runtime_execution

language:
  policy: >
    Japanese and English representations may be maintained for metadata and
    Protocol-facing material while the manuscript remains independently
    authoritative. Translation must not silently alter canon.
  supported:
    - ja
    - en

initial_target:
  work_id: maria_protocol
  first_phase:
    - source_manifest
    - chapter_map
    - landscape_manifest
  explicit_non_goals:
    - rewriting_the_manuscript
    - inferring_canon_without_author_confirmation
    - collapsing_revision_history
    - treating_ai_memory_as_source
