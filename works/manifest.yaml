matome:
  title: Shirakami Creative Works Landscape
  subtitle:
    - Works as Landscape
    - Source of Truth
    - Revision-aware Manuscript Management
    - Multi-work Continuity
  version: 0.1
  status:
    architecture: experimental
    implementation: preparation
    source_verification: pending

statement: >
  Literary works are treated as source-grounded Landscapes rather than as
  memory to be reconstructed by AI. Manuscripts remain the source of truth.
  Observations, Evidence, canonical relations, hypotheses, and unresolved
  questions are kept distinct. Revisions are preserved as transitions in the
  work's Landscape rather than silently replacing prior states.

principles:
  - manuscript_is_source_of_truth
  - preserve_revision_history
  - distinguish_observation_from_interpretation
  - distinguish_canonical_relation_from_hypothesis
  - never_silently_rewrite_source
  - author_controls_canon
  - protocol_does_not_replace_the_work

