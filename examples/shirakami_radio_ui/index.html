<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>白神ラジオ — Language UI MVP</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#222;background:#f5f3ee}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;justify-content:center}
    main{width:min(760px,100%);padding:28px 18px 42px}.brand{font-size:14px;letter-spacing:.08em;opacity:.65}
    h1{font-size:clamp(28px,6vw,44px);margin:.2em 0}.lead{line-height:1.8;color:#555}
    .card{background:#fff;border:1px solid #ddd8cf;border-radius:18px;padding:18px;margin-top:20px;box-shadow:0 8px 28px #0000000a}
    #messages{display:flex;flex-direction:column;gap:12px;min-height:220px;max-height:52vh;overflow:auto;padding:4px}
    .msg{padding:12px 14px;border-radius:14px;line-height:1.7;white-space:pre-wrap}.user{align-self:flex-end;background:#eee8dc;max-width:88%}.radio{align-self:flex-start;background:#f7f7f7;border:1px solid #e5e5e5;max-width:88%}
    form{display:flex;gap:8px;margin-top:14px}.input{flex:1;border:1px solid #ccc7be;border-radius:12px;padding:13px;font:inherit;min-width:0}.btn{border:0;border-radius:12px;padding:0 18px;font:inherit;cursor:pointer;background:#222;color:#fff}.btn:disabled{opacity:.45;cursor:wait}
    .hint{font-size:13px;color:#777;margin-top:10px}.status{font-size:12px;color:#777;margin-top:12px}.status[data-kind=error]{color:#a33}
    details{margin-top:16px;font-size:13px;color:#666}summary{cursor:pointer}.settings{display:grid;gap:8px;margin-top:10px}.settings input{width:100%;padding:9px;border:1px solid #ccc;border-radius:8px;font:inherit}
    code{font-size:.9em}
  </style>
</head>
<body>
<main>
  <div class="brand">SHIRAKAMI RUNTIME / β1.0</div>
  <h1>白神ラジオ</h1>
  <p class="lead">答えを急がず、考えていることを一緒に眺めるための小さな会話入口です。</p>

  <section class="card">
    <div id="messages" aria-live="polite">
      <div class="msg radio">こんにちは。今日は、何か話したいことがありますか？</div>
    </div>
    <form id="chat">
      <input id="input" class="input" autocomplete="off" placeholder="最近ちょっと気になっていること…" aria-label="メッセージ">
      <button id="send" class="btn" type="submit">話す</button>
    </form>
    <div class="hint">例：最近ちょっと引っかかっていること／今日あった小さな出来事</div>
    <div id="status" class="status">Demo mode: Runtime endpoint未接続</div>
  </section>

  <details>
    <summary>接続設定（開発・運用者向け）</summary>
    <div class="settings">
      <label>Runtime API endpoint
        <input id="endpoint" placeholder="http://localhost:8000/v0.1/oppai/normalize">
      </label>
      <div>現在のMVPはUIと入力境界の確認を目的とし、外部AIへの接続を内蔵しません。</div>
    </div>
  </details>
</main>
<script>
const form=document.querySelector('#chat');const input=document.querySelector('#input');const send=document.querySelector('#send');const messages=document.querySelector('#messages');const status=document.querySelector('#status');const endpoint=document.querySelector('#endpoint');
function add(text,kind){const el=document.createElement('div');el.className=`msg ${kind}`;el.textContent=text;messages.appendChild(el);messages.scrollTop=messages.scrollHeight;}
function demoReply(text){
  const cues=['それは、まだ言葉になっていない部分がありそうですね。','もう少し、そのとき何が引っかかったのか聞いてもいいですか？','「どうでもいい」と思ったところに、何か残っているものはありますか？','すぐに答えを決めずに、もう少し眺めてみましょうか。'];
  return cues[text.length%cues.length];
}
form.addEventListener('submit',async e=>{e.preventDefault();const text=input.value.trim();if(!text)return;add(text,'user');input.value='';send.disabled=true;status.dataset.kind='';
  const url=endpoint.value.trim();
  if(!url){await new Promise(r=>setTimeout(r,350));add(demoReply(text),'radio');status.textContent='Demo mode: 入力と会話UIのみ';send.disabled=false;return;}
  status.textContent='Runtimeへ送信中…';
  try{const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});if(!r.ok)throw new Error(`HTTP ${r.status}`);const data=await r.json();const reply=data.canonical_prompt||data.output||data.content||JSON.stringify(data);add(reply,'radio');status.textContent='Runtime response received';}
  catch(err){status.textContent=`接続失敗: ${err.message}`;status.dataset.kind='error';add('接続先から応答を取得できませんでした。現在は会話UIの動作だけ確認できます。','radio');}
  finally{send.disabled=false;input.focus();}
});
</script>
</body>
</html>
