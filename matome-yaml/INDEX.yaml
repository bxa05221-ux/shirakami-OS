title: Shirakami OS 的目YAML集 Index
version: 0.2

purpose: >
  これまで蓄積された「的目YAML」を、原資料・設計判断・Protocol・検証・応用知見として
  分類し、Shirakami OS リポジトリ上の正式なアーカイブへ接続するための索引。

principle: >
  原資料を捨てず、現在の仕様と到達経緯を分離する。
  的目YAMLは発見の記録、Protocolは実行仕様、Evidenceは検証結果として扱う。

categories:
  genesis:
    meaning: 白神OSの発生・発見・設計転換の履歴
    path: matome-yaml/genesis/
  architecture:
    meaning: Landscape、Runtime、Registry、分散運用などの構造上の発見
    path: matome-yaml/architecture/
  verification:
    meaning: One Change One Verification、Evidence、Replay、AI Scientist検証
    path: matome-yaml/verification/
  applications:
    meaning: 実際の用途・現場から抽出された知見
    path: matome-yaml/applications/
  observations:
    meaning: 個別の観測・セッション・状態記録
    path: matome-yaml/observations/

