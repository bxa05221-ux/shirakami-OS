related_protocol_families:
  core:
    - conversation_turn
    - guide_runtime
  cognition:
    - creative_dialogue
    - perspective
    - dark_question
    - cognitive_echo_location
  workflow:
    - thread_rpg
    - pilgrimage
  media:
    - shirakami_radio
    - manga_runtime
    - manga_manual
  metadata:
    - kaorukaze_metadata

migration_policy:
  phase_1:
    action: inventory
    result: 既存的目YAMLの原資料名・保存場所・重複関係を記録する
  phase_2:
    action: preserve_source
    result: 原資料をHistorical/Sourceとして保持する
  phase_3:
    action: extract_discovery
    result: 白神OSの設計根拠となる部分をgenesis/architecture/verificationへ整理する
  phase_4:
    action: promote_protocol
    result: 実行仕様として成熟したものだけprotocols/へ昇格する
  phase_5:
    action: link_evidence
    result: 実装・検証結果をEvidence/Replayへ接続する

important_rule: >
  「古い的目YAML」を削除して現在の仕様だけを残すことはしない。
  到達経路そのものがShirakami OSのLandscapeであり、設計根拠である。

inventory_status:
  known_library_yaml_files: 9
  unique_legacy_matome_sources: 5
  duplicate_sources_identified: 2
  canonical_archive_added_in_this_pass: 3
  source_only_pending_review: 1
  recent_derived_artifacts: 3

next_inventory_target:
