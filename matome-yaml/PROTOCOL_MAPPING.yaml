title: Shirakami OS 的目YAML → Protocol Mapping
version: 0.2
status: working_inventory

purpose: >
  的目YAML・会話から発生した設計知を、Protocol Registryの既存項目、
  新規Protocol候補、Historicalとして対応付ける。的目YAMLそのものを
  Protocolへ自動変換するのではなく、意味の境界を保ったまま昇格経路を記録する。

status_definitions:
  protocolized: 実行仕様として既存ProtocolまたはRegistry項目に対応済み
  candidate: Protocol化可能性が高いが、現時点では正式Registry未登録
  historical: 到達経路・発見記録として保存し、直接のRuntime仕様にはしない
  source_only: 原資料として保持し、内容精査待ち
  duplicate: 同一系統の重複資料
  conversation_derived: 会話から確認されたが、正式YAMLアーカイブ未収録

