registry_alignment:
  registry_source: spec/protocol-registry.yaml
  registry_branch: protocol-registry/alpha-0.1
  principle: >
    Registryは既存Protocolを索引化する。的目YAMLのHistoricalな発見記録や
    未検証候補を、Registry登録だけでRuntime Contractへ昇格させない。

promotion_rule:
  historical: genesis/archiveに保存
  candidate: Protocol boundary → schema → validation → runtime test → evidence
  protocolized: Registry entry → loader/runtime integration → verification evidence

