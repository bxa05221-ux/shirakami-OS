name: R0033 Checkpoint Delta Equivalence

on:
  pull_request:
    paths:
      - "runtime/checkpoint_delta_equivalence.py"
      - "runtime/evidence_delta.py"
      - "runtime/evidence_checkpoint.py"
      - "runtime/evidence_replay.py"
      - "tests/test_r0033_checkpoint_delta_equivalence.py"
      - ".github/workflows/r0033-checkpoint-delta-equivalence.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - run: python -m pytest tests/test_r0033_checkpoint_delta_equivalence.py -q
