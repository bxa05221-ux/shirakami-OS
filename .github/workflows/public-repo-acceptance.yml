name: Public Repo Acceptance Test

on:
  push:
    branches:
      - "ci/public-runner-smoke"
    paths:
      - ".github/workflows/public-repo-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pyyaml fastapi pydantic httpx
      - name: Run minimal executable entry point
        run: python shirakami_os.py
      - name: Run deterministic Evidence-to-Route demo
        run: python examples/evidence_route_demo.py
      - name: Run Runtime and test suite
        run: python -m pytest runtime tests -q
