name: Shirakami Quickstart CI

on:
  push:
  pull_request:
    branches: ["main"]

jobs:
  quickstart:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run dependency-free quickstart
        run: python examples/quickstart/run.py
