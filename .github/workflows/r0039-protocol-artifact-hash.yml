name: R0039 Protocol Artifact Hash

on:
  pull_request:
    paths:
      - "runtime/protocol_artifact_hash.py"
      - "tests/test_r0039_protocol_artifact_hash.py"
      - "docs/observations/r0039-protocol-artifact-hash-001.md"
      - ".github/workflows/r0039-protocol-artifact-hash.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pytest tests/test_r0039_protocol_artifact_hash.py -q
