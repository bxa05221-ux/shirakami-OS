name: Runtime β0.1 Verification

# Repository-level documentation changes are included so the required runtime check remains the verification gate during rollout.
on:
  push:
    paths:
      - "runtime/**"
      - "tests/**"
      - "api/**"
      - "reviewer/**"
      - "shbb-api/**"
      - "protocols/**"
      - "experiments/**"
      - "examples/**"
      - "docs/**"
      - "shirakami_os.py"
      - "CHECKLIST.md"
      - ".github/workflows/runtime-beta-0.1.yml"
      - "README.md"
      - "README.ja.md"
      - "VERSION"
      - "CHANGELOG.md"
  pull_request:
    paths:
      - "runtime/**"
      - "tests/**"
      - "api/**"
      - "reviewer/**"
      - "shbb-api/**"
      - "protocols/**"
      - "experiments/**"
      - "examples/**"
      - "docs/**"
      - "shirakami_os.py"
      - "CHECKLIST.md"
      - ".github/workflows/runtime-beta-0.1.yml"
      - "README.md"
      - "README.ja.md"
      - "VERSION"
      - "CHANGELOG.md"

jobs:
  test-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python -m pip install pytest fastapi httpx uvicorn PyYAML

      - name: Run Runtime and boundary tests
        run: python -m pytest runtime tests -q

      - name: Run provider HTTP observation in explicit fixture mode
        env:
          REQUIRE_LIVE_PROVIDER: "false"
        run: python experiments/copilot_http_observation.py

      - name: Run HTTP Human Gate end-to-end test
        run: python -m pytest api/test_human_gate_http_e2e.py -q

      - name: Smoke-run minimal OS entry point
        run: python shirakami_os.py

      - name: Smoke-run five-minute Human Gate demo
        run: python examples/evidence_route_demo.py

      - name: Compile manga renderer
        run: python -m py_compile runtime/manga_manual.py

      - name: Smoke-render Japanese manual
        run: python runtime/manga_manual.py protocols/manual/manga-user-manual.yaml --lang ja --output /tmp/manga-user-manual.ja.svg

      - name: Smoke-render English manual
        run: python runtime/manga_manual.py protocols/manual/manga-user-manual.yaml --lang en --output /tmp/manga-user-manual.en.svg
