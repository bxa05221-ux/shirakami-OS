name: Verification Gates — Baseline

on:
  pull_request:
    paths:
      - "runtime/**"
      - "tests/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    name: Baseline verification
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test runner
        run: python -m pip install pytest

      - name: Collect tests
        run: python -m pytest --collect-only -q

      - name: Run repository tests
        run: python -m pytest -q

      - name: Publish verification summary
        if: always()
        run: |
          {
            echo "## Verification baseline"
            echo
            echo "- V-01 through V-07: manual gate records remain authoritative"
            echo "- This workflow verifies executable repository tests only"
            echo "- A green result does not establish safety or production readiness"
          } >> "$GITHUB_STEP_SUMMARY"
