name: R0037 Independent Checkpoint Reconstruction

on:
  pull_request:
    paths:
      - "runtime/independent_checkpoint_reobservation.py"
      - "tests/test_r0037_independent_checkpoint_reconstruction.py"
      - ".github/workflows/r0037-independent-checkpoint-reconstruction.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - run: python -m pytest tests/test_r0037_independent_checkpoint_reconstruction.py -q
