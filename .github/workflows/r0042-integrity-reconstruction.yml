name: R0042 Integrity Reconstruction

on:
  pull_request:
    paths:
      - "runtime/**"
      - "tests/test_r0042_integrity_reconstruction.py"
      - ".github/workflows/r0042-integrity-reconstruction.yml"
  workflow_dispatch:

jobs:
  reconstruct-integrity-findings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pytest tests/test_r0042_integrity_reconstruction.py -q
