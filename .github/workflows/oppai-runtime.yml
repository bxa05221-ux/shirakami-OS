name: OPPAI Runtime

on:
  push:
    paths:
      - 'runtime/**'
      - 'tests/**'
      - 'docs/specs/OPPAI_Schema_v0.1.md'
      - '.github/workflows/oppai-runtime.yml'
  pull_request:
    paths:
      - 'runtime/**'
      - 'tests/**'
      - 'docs/specs/OPPAI_Schema_v0.1.md'
      - '.github/workflows/oppai-runtime.yml'

jobs:
  test-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: OPPAI core
        run: python -m pytest -q tests/test_oppai_schema.py tests/test_oppai_runtime_flow.py
      - name: OPPAI candidate discovery
        run: python -m pytest -q tests/test_oppai_candidate_discovery.py tests/test_oppai_candidate_matching.py
      - name: Pipeline and Adapter
        run: python -m pytest -q tests/test_pipeline.py tests/test_pipeline_adapter.py tests/test_protocol_pipeline_adapter_integration.py
      - name: Multi-backend substitution
        run: python -m pytest -q tests/test_same_protocol_multiple_backends.py
      - name: OPPAI vertical flow
        run: python -m pytest -q tests/test_oppai_selected_pipeline_flow.py
