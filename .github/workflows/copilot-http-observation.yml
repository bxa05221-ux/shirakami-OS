name: Copilot HTTP observation\n\non:\n  workflow_dispatch:\n  push:\n    branches:\n      - feat/copilot-provider-observation-live6:\n\njobs:\n  structural:\n    runs-on: ubuntu-latest\n    permissions:\n      contents: read\n    steps:\n      - uses: actions/checkout@v4\n        with:\n          ref: feat/copilot-provider-observation-live6\n      - uses: actions/setup-python@v5\n        with:\n          python-version: '3.12'\n      - name: Install runtime dependencies\n        run: python -m pip install --upgrade pip fastapi pydantic httpx pytest\n      - name: Verify provider-neutral HTTP boundary\n        run: python experiments/copilot_http_observation.py --fixture\n\n  live:\n    if: ${{ secrets.COPILOT_GITHUB_TOKEN != '' }}\n    needs: structural\n    runs-on: ubuntu-latest\n    permissions:\n      contents: read\n    env:\n      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}\n    steps:\n      - uses: actions/checkout@v4\n        with:\n          ref: feat/copilot-provider-observation-live6\n      - uses: actions/setup-python@v5\n        with:\n          python-version: '3.12'\n      - name: Install runtime and provider dependencies\n        run: python -m pip install --upgrade pip fastapi pydantic httpx pytest github-copilot-sdk\n      - name: Observe real provider through Shirakami\n        run: python experiments/copilot_http_observation.py\n\n  live-not-configured:\n    if: ${{ secrets.COPILOT_GITHUB_TOKEN == '' }}\n    needs: structural\n    runs-on: ubuntu-latest\n    steps:\n      - run: echo "Live provider skipped intentionally; COPILOT_GITHUB_TOKEN is not configured."