name: Copilot HTTP observation

on:
  workflow_dispatch:

jobs:
  structural:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/copilot-provider-observation-live6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt github-copilot-sdk
      - name: Run live harness in safe mode
        run: python experiments/copilot_http_observation.py

  live:
    if: ${{ secrets.COPILOT_GITHUB_TOKEN != '' }}
    needs: structural
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/copilot-provider-observation-live6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt github-copilot-sdk
      - name: Observe real provider through Shirakami
        run: python experiments/copilot_http_observation.py

  live-not-configured:
    if: ${{ secrets.COPILOT_GITHUB_TOKEN == '' }}
    needs: structural
    runs-on: ubuntu-latest
    steps:
      - run: echo "Live provider skipped intentionally; COPILOT_GITHUB_TOKEN is not configured."
