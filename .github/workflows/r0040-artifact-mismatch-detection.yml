name: R0040 Artifact Mismatch Detection

on:
  pull_request:
    paths:
      - "runtime/protocol_artifact_mismatch.py"
      - "tests/test_r0040_artifact_mismatch.py"
      - "runtime/protocol_artifact_hash.py"
      - ".github/workflows/r0040-artifact-mismatch-detection.yml"
  workflow_dispatch:

jobs:
  test-r0040:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - run: python -m pytest tests/test_r0040_artifact_mismatch.py -q
