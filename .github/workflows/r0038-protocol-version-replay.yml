name: R0038 Protocol Version Replay

on:
  pull_request:
    paths:
      - "runtime/protocol_version_replay.py"
      - "tests/test_r0038_protocol_version_replay.py"
      - "docs/observations/r0038-protocol-version-replay-001.md"
      - ".github/workflows/r0038-protocol-version-replay.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - run: python -m pytest tests/test_r0038_protocol_version_replay.py -q
