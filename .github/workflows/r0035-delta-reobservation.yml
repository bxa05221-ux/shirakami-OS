name: R0035 Delta Re-observation

on:
  pull_request:
    paths:
      - "runtime/delta_reobservation.py"
      - "runtime/checkpoint_delta_execution.py"
      - "runtime/evidence_delta.py"
      - "tests/test_r0035_delta_reobservation.py"
      - ".github/workflows/r0035-delta-reobservation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - run: python -m pytest tests/test_r0035_delta_reobservation.py -q
