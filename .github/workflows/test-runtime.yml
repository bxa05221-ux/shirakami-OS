name: test-runtime

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install pytest
      - name: Run runtime tests
        run: python -m pytest runtime tests -q
