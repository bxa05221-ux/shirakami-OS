name: R0027 Observable Execution Result

on:
  pull_request:
    paths:
      - 'runtime/**'
      - 'tests/**'
      - 'docs/observations/r0027-observable-execution-result-001.md'
      - '.github/workflows/r0027-observable-execution-result.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m pytest tests/test_r0027_observable_execution_result.py -q
