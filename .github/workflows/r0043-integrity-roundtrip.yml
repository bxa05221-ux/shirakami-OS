name: R0043 Integrity Round Trip

on:
  pull_request:
    paths:
      - "runtime/**"
      - "tests/test_r0043_integrity_roundtrip.py"
      - ".github/workflows/r0043-integrity-roundtrip.yml"
  workflow_dispatch:

jobs:
  verify-integrity-roundtrip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pytest tests/test_r0043_integrity_roundtrip.py -q
