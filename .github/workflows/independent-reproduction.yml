name: Independent Reproduction

on:
  workflow_dispatch:
  push:
    branches:
      - docs/verification-v1.0

jobs:
  reproduce:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Show environment
        run: |
          python --version
          python -m pip --version
          uname -a

      - name: Install verification dependency
        run: python -m pip install --disable-pip-version-check "pytest==8.4.2"

      - name: Run quickstart
        run: python examples/quickstart/run.py

      - name: Run runtime tests
        working-directory: runtime
        run: python -m pytest -q

      - name: Run bounded adversarial input tests
        working-directory: runtime
        run: python -m pytest -q test_adversarial_inputs.py
