name: R0031 Replay Input Isolation

on:
  pull_request:
    paths:
      - "runtime/replay_observation.py"
      - "tests/test_r0031_replay_input_isolation.py"
      - "docs/observations/r0031-replay-input-isolation-001.md"
      - ".github/workflows/r0031-replay-input-isolation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - run: python -m pytest tests/test_r0031_replay_input_isolation.py -q
