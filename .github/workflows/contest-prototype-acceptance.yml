name: Contest prototype acceptance

on:
  push:
    branches:
      - main
      - feat/contest-prototype-acceptance-v0.1
    paths:
      - ".github/workflows/contest-prototype-acceptance.yml"
      - "shirakami_os.py"
      - "examples/evidence_route_demo.py"
      - "scripts/contest_demo.py"
      - "runtime/**"
      - "tests/**"
      - "protocols/**"
      - "spec/**"
      - "docs/CONTEST_PROTOTYPE_SUBMISSION_PACK.md"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/contest-prototype-acceptance.yml"
      - "shirakami_os.py"
      - "examples/evidence_route_demo.py"
      - "scripts/contest_demo.py"
      - "runtime/**"
      - "tests/**"
      - "protocols/**"
      - "spec/**"
      - "docs/CONTEST_PROTOTYPE_SUBMISSION_PACK.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install verification dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pyyaml fastapi pydantic httpx

      - name: Run one-command contest prototype demo and acceptance suite
        run: python scripts/contest_demo.py
