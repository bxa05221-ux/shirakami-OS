name: Verification V-04 — Deep Immutability

on:
  pull_request:
    paths:
      - "runtime/evidence.py"
      - "runtime/test_evidence.py"
      - ".github/workflows/verification-v04-deep-immutability.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - run: python -m pytest runtime/test_evidence.py -q
