name: AIwitness Traceability Verification

on:
  push:
    paths:
      - "aiwitness/**"
  pull_request:
    paths:
      - "aiwitness/**"

jobs:
  traceability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install pytest pyyaml fastapi httpx
      - name: Verify AIwitness boundary
        run: pytest -q scripts/test_validate_aiwitness_boundary.py
      - name: Verify AIwitness unit boundary
        run: pytest -q aiwitness/test_witness.py aiwitness/test_store.py aiwitness/test_traceability.py
      - name: Verify runtime provenance chain
        run: pytest -q aiwitness/test_traceability_runtime.py
      - name: Verify HTTP provenance chain
        run: pytest -q aiwitness/test_traceability_http.py
