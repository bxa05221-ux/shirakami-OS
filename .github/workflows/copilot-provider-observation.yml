name: Copilot provider observation

on:
  workflow_dispatch:

jobs:
  observe:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/api-mvp-real-provider-harness-001
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install optional Copilot SDK
        run: python -m pip install --upgrade pip github-copilot-sdk
      - name: Verify provider transport import
        run: python -c "from runtime.copilot_sdk_transport import CopilotSDKProviderTransport; print('provider transport import: ok')"
      - name: Verify structural async boundary
        run: python -m pytest -q api/test_http_async_provider_boundary.py
      - name: Live provider gate
        run: |
          if [ -z "$COPILOT_GITHUB_TOKEN" ]; then
            echo "Live Copilot observation not enabled; no provider credential is configured."
            echo "This is intentional. Structural verification remains active."
            exit 0
          fi
          echo "A live provider credential is configured; execute the dedicated live observation harness before claiming MVP verification."
          exit 1
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
