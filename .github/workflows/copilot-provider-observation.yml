name: Copilot provider observation

on:
  workflow_dispatch:

jobs:
  structural:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run async provider boundary test
        run: python -m pytest -q api/test_http_async_provider_boundary.py

  live:
    if: ${{ secrets.COPILOT_GITHUB_TOKEN != '' }}
    needs: structural
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Copilot SDK
        run: python -m pip install github-copilot-sdk
      - name: Run live provider observation
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: python experiments/copilot_provider_observation.py

  live-not-configured:
    if: ${{ secrets.COPILOT_GITHUB_TOKEN == '' }}
    needs: structural
    runs-on: ubuntu-latest
    steps:
      - run: echo "COPILOT_GITHUB_TOKEN is not configured; structural observation passed and live provider execution is intentionally skipped."