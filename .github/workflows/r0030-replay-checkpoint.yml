name: R0030 Replay Checkpoint

on:
  pull_request:
    paths:
      - "runtime/evidence_checkpoint.py"
      - "tests/test_r0030_replay_checkpoint.py"
      - "docs/observations/r0030-replay-checkpoint-001.md"
      - ".github/workflows/r0030-replay-checkpoint.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - run: python -m pytest tests/test_r0030_replay_checkpoint.py -q
