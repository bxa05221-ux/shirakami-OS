name: Shirakami Operation Execution

on:
  workflow_dispatch:
    inputs:
      operation_id:
        description: "Operation ID"
        required: true
        type: string
      base_ref:
        description: "Protected baseline ref"
        required: true
        default: "main"
        type: string
      scope:
        description: "Declared operation scope"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_ref }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build operation plan
        env:
          OPERATION_ID: ${{ inputs.operation_id }}
          BASE_REF: ${{ inputs.base_ref }}
          SCOPE: ${{ inputs.scope }}
        run: |
          python - <<'PY'
          import os
          from runtime.operation_runner import OperationDefinition, plan_operation

          operation = OperationDefinition(
              operation_id=os.environ["OPERATION_ID"],
              base_ref=os.environ["BASE_REF"],
              scope=os.environ["SCOPE"],
          )
          plan = plan_operation(operation)
          print(f"operation_id={plan.operation_id}")
          print(f"base_ref={plan.base_ref}")
          print(f"verification_gate={plan.verification_gate}")
          for index, step in enumerate(plan.steps, start=1):
              print(f"step_{index}={step}")
          PY

      - name: Create operation branch and Artifact
        env:
          OPERATION_ID: ${{ inputs.operation_id }}
          BASE_REF: ${{ inputs.base_ref }}
          SCOPE: ${{ inputs.scope }}
          EXECUTION_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          branch=$(python - <<'PY'
          import os
          from runtime.operation_replay import execution_branch
          print(execution_branch(os.environ["OPERATION_ID"], os.environ["EXECUTION_ID"]))
          PY
          )
          artifact=$(python - <<'PY'
          import os
          from runtime.operation_replay import execution_artifact
          print(execution_artifact(os.environ["OPERATION_ID"], os.environ["EXECUTION_ID"]))
          PY
          )
          git switch -c "$branch"
          mkdir -p "$(dirname "$artifact")"
          cat > "$artifact" <<EOF
          # ${OPERATION_ID} — GitHub Operation Execution

          Status: execution candidate

          ## Execution Identity

          - Operation ID: ${OPERATION_ID}
          - Execution ID: ${EXECUTION_ID}

          ## Baseline

          - Base ref: ${BASE_REF}
          - Scope: ${SCOPE}
          - Verification gate: test-runtime

          ## Execution

          This Artifact was generated by the Shirakami Operation Execution workflow.
          The workflow creates a replay-safe branch and Pull Request; protected merge remains outside this workflow.
          EOF
          git add "$artifact"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ops: execute ${OPERATION_ID} (${EXECUTION_ID})"
          git push --set-upstream origin "$branch"

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATION_ID: ${{ inputs.operation_id }}
          BASE_REF: ${{ inputs.base_ref }}
          SCOPE: ${{ inputs.scope }}
          EXECUTION_ID: ${{ github.run_id }}
        run: |
          branch=$(python - <<'PY'
          import os
          from runtime.operation_replay import execution_branch
          print(execution_branch(os.environ["OPERATION_ID"], os.environ["EXECUTION_ID"]))
          PY
          )
          gh pr create \
            --base "$BASE_REF" \
            --head "$branch" \
            --title "ops: ${OPERATION_ID} operation execution (${EXECUTION_ID})" \
            --body "Automated OperationPlan execution for ${OPERATION_ID}, execution ${EXECUTION_ID}. Scope: ${SCOPE}. Protected merge remains a separate verification boundary."

      - name: Run canonical verification
        run: python -m pytest runtime tests -q
