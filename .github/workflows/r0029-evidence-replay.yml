name: R0029 Evidence Replay

on:
  pull_request:
    paths:
      - "runtime/evidence_replay.py"
      - "tests/test_r0029_evidence_replay.py"
      - "docs/observations/r0029-evidence-replay-001.md"
      - ".github/workflows/r0029-evidence-replay.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - run: python -m pytest tests/test_r0029_evidence_replay.py -q
