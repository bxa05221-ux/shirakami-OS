name: P0 evaluation security regression

on:
  pull_request:
    paths:
      - "security/local_store.py"
      - "security/test_local_store.py"
      - "api/http.py"
      - "api/test_http_evaluation_boundary.py"
      - ".github/workflows/p0-evaluation-security.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluation-store:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal dependencies
        run: python -m pip install pytest cryptography fastapi httpx pydantic
      - name: Test evaluation storage and HTTP deny boundary
        run: python -m pytest -q security/test_local_store.py api/test_http_evaluation_boundary.py
