name: Real model observation

on:
  workflow_dispatch:

jobs:
  boundary:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/real-model-adapter-001
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run keyless provider-boundary check
        run: |
          python - <<'PY'
          from runtime.real_model_adapter import ModelRequest, RealModelAdapter
          seen = {}
          def fake_transport(request: ModelRequest):
              seen['request'] = request
              return {'output': 'fixture-model-output'}
          result = RealModelAdapter(fake_transport)('Observe this input.', 'fixture.real-model')
          assert result == {'output': 'fixture-model-output'}
          assert seen['request'].canonical_prompt == 'Observe this input.'
          assert seen['request'].context == {'protocol_id': 'fixture.real-model'}
          print('provider boundary: PASS')
          PY

  real-model:
    if: ${{ secrets.OPENAI_API_KEY != '' && secrets.OPENAI_MODEL != '' }}
    needs: boundary
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/real-model-adapter-001
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run one-shot real model observation
        run: python experiments/real_model_observation.py
