name: R0028 Operational Landscape Cycle

on:
  pull_request:
    paths:
      - "runtime/**"
      - "tests/**"
      - "docs/observations/**"
      - ".github/workflows/r0028-operational-landscape-cycle.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - run: python -m pytest tests/test_r0028_operational_landscape_cycle.py -q

  live-cycle:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SHIRAKAMI_LIVE_GITHUB_TEST: "1"
      SHIRAKAMI_GITHUB_TOKEN: ${{ github.token }}
      SHIRAKAMI_GITHUB_OWNER: bxa05221-ux
      SHIRAKAMI_GITHUB_REPO: shirakami-OS
      SHIRAKAMI_GITHUB_BRANCH: main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m runtime.operational_landscape_cycle
