name: Real Landscape Vertical Slice

on:
  push:
    paths:
      - "runtime/**"
      - "tests/test_real_landscape_vertical_slice.py"
      - "tests/fixtures/dogfight_scene.json"
      - "matome-yaml/project-source-registry-v0.1.yaml"
      - ".github/workflows/real-landscape-vertical-slice.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - run: python -m pytest tests/test_real_landscape_vertical_slice.py -q
